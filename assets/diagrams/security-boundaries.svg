<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="auto">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="sec-public" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <linearGradient id="sec-gateway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="sec-internal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sec-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="sec-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <marker id="arr-pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f472b6" />
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c084fc" />
    </marker>

    <style>
      .txt-title { font-family: 'Ubuntu', sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
      .txt-sub { font-family: 'Ubuntu', sans-serif; font-size: 13px; fill: #94a3b8; }
      .txt-hdr { font-family: 'Ubuntu', sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .txt-body { font-family: 'Ubuntu', sans-serif; font-size: 12px; fill: #e2e8f0; }
      .txt-dim { font-family: 'Ubuntu', sans-serif; font-size: 11px; fill: #94a3b8; }
      .txt-code { font-family: 'Ubuntu Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .flow-line { stroke-dasharray: 6,4; animation: dash 1.5s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="1280" height="840" fill="url(#canvas-bg)" rx="18" stroke="#334155" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <text x="640" y="42" text-anchor="middle" class="txt-title">Enterprise Security Boundaries &amp; Defense-in-Depth Architecture</text>
  <text x="640" y="65" text-anchor="middle" class="txt-sub">Public Ingress Security • Process Isolation • AI Defense Guardrails • Destination Credential Encapsulation</text>

  <!-- Top 5 Boundary Cards (Spaciously arranged across width 1280) -->
  <!-- 1. Public Ingress -->
  <g transform="translate(30, 95)" filter="url(#soft-shadow)">
    <rect width="225" height="270" fill="url(#sec-public)" stroke="#f472b6" stroke-width="1.5" rx="14" />
    <rect x="15" y="15" width="195" height="32" rx="6" fill="#0f172a" stroke="#f472b6" />
    <text x="112" y="36" text-anchor="middle" class="txt-hdr" fill="#fbcfe8">1. Public Ingress</text>
    <text x="112" y="65" text-anchor="middle" class="txt-dim">Cloud Foundry Gorouter</text>

    <g transform="translate(15, 80)">
      <rect width="195" height="46" rx="6" fill="#0f172a" stroke="#f472b6" />
      <text x="12" y="22" class="txt-hdr" fill="#fbcfe8">TLS 1.3 Termination</text>
      <text x="12" y="38" class="txt-dim">Strict HTTPS only on port 443</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="195" height="46" rx="6" fill="#0f172a" stroke="#f472b6" />
      <text x="12" y="22" class="txt-hdr" fill="#fbcfe8">DDoS / Firewall Filter</text>
      <text x="12" y="38" class="txt-dim">CF Ingress Edge Protection</text>
    </g>

    <g transform="translate(15, 192)">
      <rect width="195" height="55" rx="6" fill="#0f172a" stroke="#f472b6" />
      <text x="12" y="22" class="txt-hdr" fill="#fbcfe8">Internal Port Forward</text>
      <text x="12" y="42" class="txt-code">Port 443 ➔ Droplet $PORT</text>
    </g>
  </g>

  <!-- 2. Node.js Edge Gateway -->
  <g transform="translate(280, 95)" filter="url(#soft-shadow)">
    <rect width="225" height="270" fill="url(#sec-gateway)" stroke="#2dd4bf" stroke-width="1.5" rx="14" />
    <rect x="15" y="15" width="195" height="32" rx="6" fill="#042f2e" stroke="#2dd4bf" />
    <text x="112" y="36" text-anchor="middle" class="txt-hdr" fill="#99f6e4">2. Node.js Gateway</text>
    <text x="112" y="65" text-anchor="middle" class="txt-dim">Public Facing App Process</text>

    <g transform="translate(15, 80)">
      <rect width="195" height="46" rx="6" fill="#042f2e" stroke="#2dd4bf" />
      <text x="12" y="22" class="txt-hdr" fill="#5eead4">Sliding Rate Limiter</text>
      <text x="12" y="38" class="txt-dim">15 req/min per client IP</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="195" height="46" rx="6" fill="#042f2e" stroke="#2dd4bf" />
      <text x="12" y="22" class="txt-hdr" fill="#5eead4">Helmet &amp; CORS</text>
      <text x="12" y="38" class="txt-dim">Strict origin headers &amp; CSP</text>
    </g>

    <g transform="translate(15, 192)">
      <rect width="195" height="55" rx="6" fill="#042f2e" stroke="#2dd4bf" />
      <text x="12" y="22" class="txt-hdr" fill="#5eead4">XSUAA JWT Validation</text>
      <text x="12" y="42" class="txt-code">Bearer token auth checks</text>
    </g>
  </g>

  <!-- 3. Python Subprocess Isolation -->
  <g transform="translate(530, 95)" filter="url(#soft-shadow)">
    <rect width="225" height="270" fill="url(#sec-internal)" stroke="#60a5fa" stroke-width="1.5" rx="14" />
    <rect x="15" y="15" width="195" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" />
    <text x="112" y="36" text-anchor="middle" class="txt-hdr" fill="#bae6fd">3. Python Subprocess</text>
    <text x="112" y="65" text-anchor="middle" class="txt-dim">Internal Zero-Port Worker</text>

    <g transform="translate(15, 80)">
      <rect width="195" height="46" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="12" y="22" class="txt-hdr" fill="#67e8f9">Zero Network Sockets</text>
      <text x="12" y="38" class="txt-dim">No open TCP/UDP listening ports</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="195" height="46" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="12" y="22" class="txt-hdr" fill="#67e8f9">stdin/stdout Pipe Only</text>
      <text x="12" y="38" class="txt-dim">Encapsulated child process IPC</text>
    </g>

    <g transform="translate(15, 192)">
      <rect width="195" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="12" y="22" class="txt-hdr" fill="#67e8f9">Memory Isolation</text>
      <text x="12" y="42" class="txt-code">Protected ML &amp; AI worker</text>
    </g>
  </g>

  <!-- 4. AI Defense Guardrails -->
  <g transform="translate(780, 95)" filter="url(#soft-shadow)">
    <rect width="225" height="270" fill="url(#sec-ai)" stroke="#c084fc" stroke-width="1.5" rx="14" />
    <rect x="15" y="15" width="195" height="32" rx="6" fill="#1e1b4b" stroke="#a855f7" />
    <text x="112" y="36" text-anchor="middle" class="txt-hdr" fill="#e9d5ff">4. AI Defense-in-Depth</text>
    <text x="112" y="65" text-anchor="middle" class="txt-dim">Defense-in-Depth Suite</text>

    <g transform="translate(15, 80)">
      <rect width="195" height="46" rx="6" fill="#0f172a" stroke="#c084fc" />
      <text x="12" y="22" class="txt-hdr" fill="#d8b4fe">Prompt Injection Defense</text>
      <text x="12" y="38" class="txt-dim">Jailbreak / DAN attack filter</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="195" height="46" rx="6" fill="#0f172a" stroke="#c084fc" />
      <text x="12" y="22" class="txt-hdr" fill="#d8b4fe">PII / Secret Redaction</text>
      <text x="12" y="38" class="txt-dim">Auto-scrubs keys, emails, cards</text>
    </g>

    <g transform="translate(15, 192)">
      <rect width="195" height="55" rx="6" fill="#0f172a" stroke="#c084fc" />
      <text x="12" y="22" class="txt-hdr" fill="#d8b4fe">Groundedness Validator</text>
      <text x="12" y="42" class="txt-code">Filters competitor brands</text>
    </g>
  </g>

  <!-- 5. Protected BTP Backends -->
  <g transform="translate(1030, 95)" filter="url(#soft-shadow)">
    <rect width="220" height="270" fill="url(#sec-backend)" stroke="#ea580c" stroke-width="1.5" rx="14" />
    <rect x="15" y="15" width="190" height="32" rx="6" fill="#431407" stroke="#ea580c" />
    <text x="110" y="36" text-anchor="middle" class="txt-hdr" fill="#fed7aa">5. BTP Backends</text>
    <text x="110" y="65" text-anchor="middle" class="txt-dim">Encapsulated Cloud Services</text>

    <g transform="translate(15, 80)">
      <rect width="190" height="46" rx="6" fill="#0f172a" stroke="#ea580c" />
      <text x="12" y="22" class="txt-hdr" fill="#fed7aa">Destination Service</text>
      <text x="12" y="38" class="txt-dim">No hardcoded API credentials</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="190" height="46" rx="6" fill="#0f172a" stroke="#ea580c" />
      <text x="12" y="22" class="txt-hdr" fill="#fed7aa">HANA Cloud TLS</text>
      <text x="12" y="38" class="txt-dim">Encrypted VECTOR table queries</text>
    </g>

    <g transform="translate(15, 192)">
      <rect width="190" height="55" rx="6" fill="#0f172a" stroke="#ea580c" />
      <text x="12" y="22" class="txt-hdr" fill="#fed7aa">Redis Instance TLS</text>
      <text x="12" y="42" class="txt-code">Encrypted prompt cache</text>
    </g>
  </g>

  <!-- Connectors Between Top Cards -->
  <path d="M 255,210 L 280,210" stroke="#f472b6" stroke-width="2.5" class="flow-line" marker-end="url(#arr-pink)" />
  <path d="M 505,210 L 530,210" stroke="#2dd4bf" stroke-width="2.5" class="flow-line" marker-end="url(#arr-teal)" />
  <path d="M 755,210 L 780,210" stroke="#38bdf8" stroke-width="2.5" class="flow-line" marker-end="url(#arr-blue)" />
  <path d="M 1005,210 L 1030,210" stroke="#c084fc" stroke-width="2.5" class="flow-line" marker-end="url(#arr-purple)" />

  <!-- Security Audit & Mitigation Matrix Table (Bottom, w: 1220) -->
  <g transform="translate(30, 395)" filter="url(#soft-shadow)">
    <rect width="1220" height="415" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16" />
    <rect width="1220" height="46" fill="#0f172a" rx="16" />
    <text x="610" y="28" text-anchor="middle" class="txt-hdr" fill="#38bdf8">Security Controls &amp; Threat Mitigation Matrix</text>

    <!-- Table Header Row -->
    <text x="45" y="76" class="txt-hdr" fill="#ffffff">Boundary Layer</text>
    <text x="260" y="76" class="txt-hdr" fill="#ffffff">Primary Defense Mechanism</text>
    <text x="650" y="76" class="txt-hdr" fill="#ffffff">Mitigated Risk / Threat Vector</text>
    <text x="1010" y="76" class="txt-hdr" fill="#ffffff">Enforcement Point</text>
    <line x1="30" y1="90" x2="1190" y2="90" stroke="#334155" stroke-width="1" />

    <!-- Row 1 -->
    <text x="45" y="122" class="txt-hdr" fill="#f472b6">1. Public Ingress</text>
    <text x="260" y="122" class="txt-dim">TLS 1.3 HTTPS Termination + Gorouter filtering</text>
    <text x="650" y="122" class="txt-dim">Man-in-the-Middle (MITM) &amp; Packet Tampering</text>
    <text x="1010" y="122" class="txt-code">CF Gorouter Edge</text>

    <!-- Row 2 -->
    <text x="45" y="172" class="txt-hdr" fill="#2dd4bf">2. Node.js Gateway</text>
    <text x="260" y="172" class="txt-dim">XSUAA JWT Validation + Sliding Rate Limiter (15 req/min)</text>
    <text x="650" y="172" class="txt-dim">Unauthorized Access, Denial of Service (DoS), &amp; CSRF</text>
    <text x="1010" y="172" class="txt-code">srv/server.js Middleware</text>

    <!-- Row 3 -->
    <text x="45" y="222" class="txt-hdr" fill="#38bdf8">3. Python Worker</text>
    <text x="260" y="222" class="txt-dim">No open TCP sockets; stdin/stdout JSON-RPC pipe</text>
    <text x="650" y="222" class="txt-dim">Direct Remote Code Execution &amp; External Port Scans</text>
    <text x="1010" y="222" class="txt-code">srv/python.js Subprocess</text>

    <!-- Row 4 -->
    <text x="45" y="272" class="txt-hdr" fill="#c084fc">4. AI Guardrails</text>
    <text x="260" y="272" class="txt-dim">Signature detection + Regex Secret &amp; PII Scrubbing</text>
    <text x="650" y="272" class="txt-dim">Jailbreaks, DAN Attacks, Token Leakage, Hallucination</text>
    <text x="1010" y="272" class="txt-code">python/agent/guardrails.py</text>

    <!-- Row 5 -->
    <text x="45" y="322" class="txt-hdr" fill="#fb923c">5. BTP Backends</text>
    <text x="260" y="322" class="txt-dim">Dynamic Destination Service auto-resolution</text>
    <text x="650" y="322" class="txt-dim">Hardcoded Credentials &amp; API Key Leaks in Git Repos</text>
    <text x="1010" y="322" class="txt-code">srv/ai-destination.js</text>

    <!-- Row 6 -->
    <text x="45" y="372" class="txt-hdr" fill="#a7f3d0">6. Redis Cache</text>
    <text x="260" y="372" class="txt-dim">SHA-256 hashed keys + TLS encrypted VCAP binding</text>
    <text x="650" y="372" class="txt-dim">Cache Poisoning &amp; Unauthenticated Memory Snooping</text>
    <text x="1010" y="372" class="txt-code">python/agent/cache.py</text>
  </g>
</svg>
