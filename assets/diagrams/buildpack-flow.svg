<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="auto">
  <defs>
    <linearGradient id="grad-manifest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-deploy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="grad-staging" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-droplet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5" />
      <stop offset="100%" stop-color="#e1bee7" />
    </linearGradient>
    <linearGradient id="grad-running" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>

    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(15, 23, 42, 0.08)" />
    </filter>

    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb" />
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#d97706" />
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#9333ea" />
    </marker>
    <marker id="arr-pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#db2777" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#16a34a" />
    </marker>

    <style>
      .node-card { rx: 12; ry: 12; stroke-width: 1.5; filter: url(#shadow); }
      .txt-hdr { font-family: Ubuntu, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .txt-lbl { font-family: Ubuntu, system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: #334155; }
      .txt-sub { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; fill: #64748b; }
      .flow-path { stroke-dasharray: 6,4; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .chip { rx: 4; ry: 4; fill: #ffffff; stroke-width: 1; }
      .chip-txt { font-family: Ubuntu, system-ui, sans-serif; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#ffffff" rx="16" />

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Cloud Foundry Multi-Buildpack Lifecycle</text>
  <text x="550" y="56" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="12" fill="#64748b">Sequential Staging • Dual Runtime Provisioning • Container Orchestration</text>

  <!-- Stage Cards Top Row -->
  <!-- 1. manifest.yml -->
  <g transform="translate(30, 85)">
    <rect width="180" height="120" fill="url(#grad-manifest)" stroke="#bfdbfe" class="node-card" />
    <text x="90" y="30" text-anchor="middle" class="txt-hdr">1. manifest.yml</text>
    <text x="90" y="50" text-anchor="middle" class="txt-lbl">Buildpack Spec</text>
    <rect x="15" y="66" width="150" height="24" rx="6" fill="#ffffff" stroke="#93c5fd" />
    <text x="90" y="82" text-anchor="middle" class="txt-sub">1. python_buildpack</text>
    <rect x="15" y="94" width="150" height="20" rx="6" fill="#ffffff" stroke="#93c5fd" />
    <text x="90" y="108" text-anchor="middle" class="txt-sub">2. nodejs_buildpack</text>
  </g>

  <!-- 2. CF Staging -->
  <g transform="translate(250, 85)">
    <rect width="180" height="120" fill="url(#grad-deploy)" stroke="#fed7aa" class="node-card" />
    <text x="90" y="30" text-anchor="middle" class="txt-hdr">2. CF Staging Engine</text>
    <text x="90" y="50" text-anchor="middle" class="txt-lbl">Diego Cell Stager</text>
    <rect x="15" y="66" width="150" height="24" rx="6" fill="#ffffff" stroke="#fdba74" />
    <text x="90" y="82" text-anchor="middle" class="txt-sub">Uploads Source Artifact</text>
    <rect x="15" y="94" width="150" height="20" rx="6" fill="#ffffff" stroke="#fdba74" />
    <text x="90" y="108" text-anchor="middle" class="txt-sub">Resolves Buildpacks</text>
  </g>

  <!-- 3. Dual Staging -->
  <g transform="translate(470, 85)">
    <rect width="180" height="120" fill="url(#grad-staging)" stroke="#86efac" class="node-card" />
    <text x="90" y="30" text-anchor="middle" class="txt-hdr">3. Sequential Build</text>
    <text x="90" y="50" text-anchor="middle" class="txt-lbl">Provision Runtimes</text>
    <rect x="15" y="66" width="150" height="24" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="90" y="82" text-anchor="middle" class="txt-sub">pip install requirements</text>
    <rect x="15" y="94" width="150" height="20" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="90" y="108" text-anchor="middle" class="txt-sub">npm install packages</text>
  </g>

  <!-- 4. Droplet -->
  <g transform="translate(690, 85)">
    <rect width="180" height="120" fill="url(#grad-droplet)" stroke="#d8b4fe" class="node-card" />
    <text x="90" y="30" text-anchor="middle" class="txt-hdr">4. Droplet Ready</text>
    <text x="90" y="50" text-anchor="middle" class="txt-lbl">Container Layer</text>
    <rect x="15" y="66" width="150" height="24" rx="6" fill="#ffffff" stroke="#c084fc" />
    <text x="90" y="82" text-anchor="middle" class="txt-sub">Python 3 + Node.js LTS</text>
    <rect x="15" y="94" width="150" height="20" rx="6" fill="#ffffff" stroke="#c084fc" />
    <text x="90" y="108" text-anchor="middle" class="txt-sub">Source + server.js</text>
  </g>

  <!-- 5. Running Container -->
  <g transform="translate(900, 85)">
    <rect width="170" height="120" fill="url(#grad-running)" stroke="#f472b6" class="node-card" />
    <text x="85" y="30" text-anchor="middle" class="txt-hdr">5. App Running</text>
    <text x="85" y="50" text-anchor="middle" class="txt-lbl">Live Runtimes</text>
    <rect x="15" y="66" width="140" height="24" rx="6" fill="#ffffff" stroke="#f472b6" />
    <text x="85" y="82" text-anchor="middle" class="txt-sub">npm start (server.js)</text>
    <rect x="15" y="94" width="140" height="20" rx="6" fill="#ffffff" stroke="#f472b6" />
    <text x="85" y="108" text-anchor="middle" class="txt-sub">Spawns python worker</text>
  </g>

  <!-- Connectors Between Top Cards (Y=145) -->
  <path d="M 210,145 L 250,145" stroke="#2563eb" stroke-width="2" class="flow-path" marker-end="url(#arr-blue)" />
  <path d="M 430,145 L 470,145" stroke="#d97706" stroke-width="2" class="flow-path" marker-end="url(#arr-amber)" />
  <path d="M 650,145 L 690,145" stroke="#16a34a" stroke-width="2" class="flow-path" marker-end="url(#arr-green)" />
  <path d="M 870,145 L 900,145" stroke="#9333ea" stroke-width="2" class="flow-path" marker-end="url(#arr-purple)" />

  <!-- Detailed Table (Bottom) -->
  <g transform="translate(30, 250)">
    <rect width="1040" height="400" fill="#f8fafc" stroke="#e2e8f0" rx="14" filter="url(#shadow)" />
    <rect width="1040" height="42" fill="#f1f5f9" rx="14" />
    <text x="520" y="26" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Step-by-Step Staging &amp; Orchestration Matrix</text>

    <!-- Row 1 -->
    <g transform="translate(40, 60)">
      <circle cx="15" cy="15" r="12" fill="#2563eb" />
      <text x="15" y="19" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
      <text x="40" y="19" class="txt-lbl"><tspan font-weight="700" fill="#0f172a">Manifest Configuration:</tspan> Cloud Foundry reads manifest.yml containing the buildpacks list array.</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(40, 110)">
      <circle cx="15" cy="15" r="12" fill="#d97706" />
      <text x="15" y="19" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
      <text x="40" y="19" class="txt-lbl"><tspan font-weight="700" fill="#0f172a">Source Upload:</tspan> cf push packages application source code, package.json, and python scripts.</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(40, 160)">
      <circle cx="15" cy="15" r="12" fill="#16a34a" />
      <text x="15" y="19" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
      <text x="40" y="19" class="txt-lbl"><tspan font-weight="700" fill="#0f172a">Python Buildpack Phase:</tspan> Installs Python interpreter and installs dependencies from requirements.txt.</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(40, 210)">
      <circle cx="15" cy="15" r="12" fill="#16a34a" />
      <text x="15" y="19" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#ffffff">4</text>
      <text x="40" y="19" class="txt-lbl"><tspan font-weight="700" fill="#0f172a">Node.js Buildpack Phase:</tspan> Installs Node.js runtime and executes npm install for @sap/cds packages.</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(40, 260)">
      <circle cx="15" cy="15" r="12" fill="#9333ea" />
      <text x="15" y="19" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#ffffff">5</text>
      <text x="40" y="19" class="txt-lbl"><tspan font-weight="700" fill="#0f172a">Droplet Assembly:</tspan> Staging engine bundles both runtime layers into a unified container image.</text>
    </g>

    <!-- Row 6 -->
    <g transform="translate(40, 310)">
      <circle cx="15" cy="15" r="12" fill="#db2777" />
      <text x="15" y="19" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#ffffff">6</text>
      <text x="40" y="19" class="txt-lbl"><tspan font-weight="700" fill="#0f172a">Runtime Orchestration:</tspan> Container launches npm start -> srv/python.js lazily spawns python worker.</text>
    </g>
  </g>
</svg>
