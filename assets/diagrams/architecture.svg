<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="auto">
  <defs>
    <!-- Card Gradients (High Contrast, Deep Dark Luxury Palette) -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="droplet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="python-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="dest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1205" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Model Priority Gradients -->
    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="p3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="p4-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-teal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#14b8a6" flood-opacity="0.3" />
    </filter>

    <!-- Markers -->
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#fbbf24" />
    </marker>

    <style>
      .txt-title { font-family: 'Ubuntu', sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; letter-spacing: -0.02em; }
      .txt-sub { font-family: 'Ubuntu', sans-serif; font-size: 13px; fill: #94a3b8; }
      .txt-hdr { font-family: 'Ubuntu', sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .txt-body { font-family: 'Ubuntu', sans-serif; font-size: 12px; fill: #e2e8f0; }
      .txt-dim { font-family: 'Ubuntu', sans-serif; font-size: 11px; fill: #94a3b8; }
      .txt-code { font-family: 'Ubuntu Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .txt-pill { font-family: 'Ubuntu', sans-serif; font-size: 11px; font-weight: 600; }
      .flow-line { stroke-dasharray: 6,4; animation: dash 1.5s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="1280" height="840" fill="url(#canvas-bg)" rx="18" stroke="#334155" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <text x="640" y="42" text-anchor="middle" class="txt-title">SAP BTP Bookshop Multi-Buildpack — Enterprise AI Architecture</text>
  <text x="640" y="65" text-anchor="middle" class="txt-sub">Cloud Foundry 512 MB Droplet • CAP Edge Gateway • LangGraph Stateful Agent • HANA Vector Engine • 4-Destination Failover</text>

  <!-- ==================== COLUMN 1: CLIENT INGRESS (x: 30, w: 220) ==================== -->
  <g transform="translate(30, 95)" filter="url(#soft-shadow)">
    <rect width="220" height="715" fill="url(#client-grad)" stroke="#475569" stroke-width="1.5" rx="14" />
    <rect x="15" y="18" width="190" height="34" rx="8" fill="#0f172a" stroke="#64748b" />
    <text x="110" y="40" text-anchor="middle" class="txt-hdr">🌐 Client Ingress Layer</text>

    <!-- Fiori UI Card -->
    <g transform="translate(15, 68)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" class="txt-hdr" fill="#38bdf8">Fiori Elements UI</text>
      <text x="15" y="44" class="txt-dim">OData V4 Catalog</text>
      <text x="15" y="60" class="txt-code">/browse/Books</text>
    </g>

    <!-- Single Turn AI Ask -->
    <g transform="translate(15, 152)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" class="txt-hdr" fill="#38bdf8">Single-Turn AI Completion</text>
      <text x="15" y="44" class="txt-dim">Direct LLM Prompt</text>
      <text x="15" y="60" class="txt-code">POST /ai/ask</text>
    </g>

    <!-- HANA Vector RAG -->
    <g transform="translate(15, 236)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" class="txt-hdr" fill="#34d399">HANA Vector RAG Search</text>
      <text x="15" y="44" class="txt-dim">REAL_VECTOR 1536</text>
      <text x="15" y="60" class="txt-code">POST /ai/ask_rag</text>
    </g>

    <!-- LangGraph Stateful Agent -->
    <g transform="translate(15, 320)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" class="txt-hdr" fill="#c084fc">Stateful Agent Workflow</text>
      <text x="15" y="44" class="txt-dim">Reasoning &amp; Memory</text>
      <text x="15" y="60" class="txt-code">POST /ai/ask_agent</text>
    </g>

    <!-- SSE Real-time Streaming -->
    <g transform="translate(15, 404)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" class="txt-hdr" fill="#fb923c">Server-Sent Events (SSE)</text>
      <text x="15" y="44" class="txt-dim">Real-time Token Stream</text>
      <text x="15" y="60" class="txt-code">POST /ai/ask/stream</text>
    </g>

    <!-- Health & Ready Probes -->
    <g transform="translate(15, 488)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" class="txt-hdr" fill="#a7f3d0">System Probes</text>
      <text x="15" y="44" class="txt-dim">Liveness &amp; IPC Readiness</text>
      <text x="15" y="60" class="txt-code">/healthz • /readyz</text>
    </g>

    <!-- Ingress Security Controls -->
    <g transform="translate(15, 572)">
      <rect width="190" height="125" rx="8" fill="#022c22" stroke="#059669" />
      <text x="15" y="24" class="txt-hdr" fill="#6ee7b7">🔒 Ingress Security</text>
      <text x="15" y="48" class="txt-dim">• Rate Limiter: 15 req/min</text>
      <text x="15" y="68" class="txt-dim">• Helmet &amp; CORS Policies</text>
      <text x="15" y="88" class="txt-dim">• XSUAA JWT Verification</text>
      <text x="15" y="108" class="txt-code">429 on abuse / 401 on unauth</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: SAP BTP CF CONTAINER DROPLET (x: 275, w: 680) ==================== -->
  <g transform="translate(275, 95)" filter="url(#soft-shadow)">
    <rect width="680" height="715" fill="url(#droplet-grad)" stroke="#38bdf8" stroke-width="2" rx="16" />
    <rect x="20" y="16" width="640" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" />
    <text x="340" y="38" text-anchor="middle" class="txt-hdr" fill="#38bdf8">📦 SAP BTP Cloud Foundry Container Droplet (512 MB Single-Tenant Pod)</text>

    <!-- Node.js CAP Edge Gateway -->
    <g transform="translate(20, 60)">
      <rect width="640" height="165" fill="url(#node-grad)" stroke="#2dd4bf" stroke-width="1.5" rx="12" filter="url(#glow-teal)" />
      <text x="320" y="26" text-anchor="middle" class="txt-hdr" fill="#ffffff">⚡ Node.js CAP Edge Gateway (@sap/cds v10 + Express Engine)</text>

      <!-- CAP Subcard 1 -->
      <rect x="15" y="42" width="195" height="108" rx="8" fill="#042f2e" stroke="#14b8a6" />
      <text x="25" y="66" class="txt-hdr" fill="#5eead4">OData V4 Core</text>
      <text x="25" y="86" class="txt-dim">• Books &amp; Authors Catalog</text>
      <text x="25" y="104" class="txt-dim">• Orders &amp; Stock Updates</text>
      <text x="25" y="122" class="txt-dim">• ML discount() Handler</text>
      <text x="25" y="140" class="txt-code">/browse/discount()</text>

      <!-- CAP Subcard 2 -->
      <rect x="222" y="42" width="195" height="108" rx="8" fill="#042f2e" stroke="#14b8a6" />
      <text x="232" y="66" class="txt-hdr" fill="#5eead4">Auto-Destination Select</text>
      <text x="232" y="86" class="txt-dim">• @sap-cloud-sdk/conn</text>
      <text x="232" y="104" class="txt-dim">• Auto-resolves BTP binding</text>
      <text x="232" y="122" class="txt-dim">• Zero hardcoded secrets</text>
      <text x="232" y="140" class="txt-code">srv/ai-destination.js</text>

      <!-- CAP Subcard 3 -->
      <rect x="430" y="42" width="195" height="108" rx="8" fill="#042f2e" stroke="#14b8a6" />
      <text x="440" y="66" class="txt-hdr" fill="#5eead4">IPC Controller</text>
      <text x="440" y="86" class="txt-dim">• Spawns Python lazily</text>
      <text x="440" y="104" class="txt-dim">• Newline JSON-RPC</text>
      <text x="440" y="122" class="txt-dim">• 0ms per-call cold start</text>
      <text x="440" y="140" class="txt-code">srv/python.js Bridge</text>
    </g>

    <!-- IPC Bridge Banner Connector -->
    <g transform="translate(180, 235)">
      <rect width="320" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="160" y="20" text-anchor="middle" class="txt-code" fill="#38bdf8">⇄ stdin / stdout JSON-RPC IPC Channel ⇄</text>
    </g>
    <path d="M 340,225 L 340,235" stroke="#38bdf8" stroke-width="2.5" class="flow-line" marker-end="url(#arr-blue)" />
    <path d="M 340,265 L 340,275" stroke="#38bdf8" stroke-width="2.5" class="flow-line" marker-end="url(#arr-blue)" />

    <!-- Co-located Python ML Worker -->
    <g transform="translate(20, 275)">
      <rect width="640" height="420" fill="url(#python-grad)" stroke="#60a5fa" stroke-width="1.5" rx="12" />
      <text x="320" y="26" text-anchor="middle" class="txt-hdr" fill="#ffffff">🐍 Co-located Python ML Worker (LangChain + LangGraph + Defense-in-Depth Guardrails)</text>

      <!-- Python Subsystem 1: Defense-in-Depth Guardrails -->
      <g transform="translate(15, 42)">
        <rect width="295" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" />
        <text x="15" y="24" class="txt-hdr" fill="#67e8f9">🛡️ Defense-in-Depth Input Guardrails</text>
        <text x="15" y="44" class="txt-dim">• Direct/Indirect prompt injection scanner</text>
        <text x="15" y="62" class="txt-dim">• Secret &amp; PII auto-redaction (regex filter)</text>
        <text x="15" y="80" class="txt-code">python/agent/guardrails.py</text>
      </g>

      <!-- Python Subsystem 2: Redis Prompt Cache -->
      <g transform="translate(330, 42)">
        <rect width="295" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" />
        <text x="15" y="24" class="txt-hdr" fill="#67e8f9">⚡ Enterprise Redis Prompt Cache</text>
        <text x="15" y="44" class="txt-dim">• SHA-256 (model:prompt) key signature</text>
        <text x="15" y="62" class="txt-dim">• &lt; 5ms cached response hit time (1h TTL)</text>
        <text x="15" y="80" class="txt-code">python/agent/cache.py</text>
      </g>

      <!-- Python Subsystem 3: LangGraph Stateful Agent -->
      <g transform="translate(15, 146)">
        <rect width="295" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" />
        <text x="15" y="24" class="txt-hdr" fill="#a78bfa">🧠 LangGraph Stateful Agent</text>
        <text x="15" y="44" class="txt-dim">• StateGraph pipeline with multi-turn memory</text>
        <text x="15" y="62" class="txt-dim">• Tool nodes: Stock check &amp; discount math</text>
        <text x="15" y="80" class="txt-dim">• Context compression (50%+ token savings)</text>
        <text x="15" y="98" class="txt-code">python/agent/graph.py</text>
      </g>

      <!-- Python Subsystem 4: HANA Vector Engine -->
      <g transform="translate(330, 146)">
        <rect width="295" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" />
        <text x="15" y="24" class="txt-hdr" fill="#34d399">📐 SAP HANA Cloud Vector RAG</text>
        <text x="15" y="44" class="txt-dim">• Native REAL_VECTOR(1536) embeddings</text>
        <text x="15" y="62" class="txt-dim">• COSINE_SIMILARITY() catalog search</text>
        <text x="15" y="80" class="txt-dim">• HanaDB LangChain VectorStore</text>
        <text x="15" y="98" class="txt-code">python/agent/rag.py</text>
      </g>

      <!-- Python Subsystem 5: Multi-Model Router & Failover -->
      <g transform="translate(15, 262)">
        <rect width="610" height="142" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <text x="20" y="26" class="txt-hdr" fill="#fbbf24">🔄 Multi-Model Router &amp; Failover Cascade Engine (python/agent/llm_router.py)</text>
        
        <!-- Failover visual pills -->
        <rect x="20" y="42" width="135" height="40" rx="6" fill="#064e3b" stroke="#34d399" />
        <text x="87" y="60" text-anchor="middle" class="txt-pill" fill="#a7f3d0">1. DiffusionGemma</text>
        <text x="87" y="74" text-anchor="middle" class="txt-dim">Priority 1 Primary</text>

        <text x="165" y="66" class="txt-hdr" fill="#94a3b8">➔</text>

        <rect x="180" y="42" width="125" height="40" rx="6" fill="#0c4a6e" stroke="#38bdf8" />
        <text x="242" y="60" text-anchor="middle" class="txt-pill" fill="#bae6fd">2. Gemma 4 31B</text>
        <text x="242" y="74" text-anchor="middle" class="txt-dim">Priority 2 (P2)</text>

        <text x="315" y="66" class="txt-hdr" fill="#94a3b8">➔</text>

        <rect x="330" y="42" width="115" height="40" rx="6" fill="#4c1d95" stroke="#c084fc" />
        <text x="387" y="60" text-anchor="middle" class="txt-pill" fill="#e9d5ff">3. GLM 5.2</text>
        <text x="387" y="74" text-anchor="middle" class="txt-dim">Priority 3</text>

        <text x="455" y="66" class="txt-hdr" fill="#94a3b8">➔</text>

        <rect x="470" y="42" width="125" height="40" rx="6" fill="#7c2d12" stroke="#ea580c" />
        <text x="532" y="60" text-anchor="middle" class="txt-pill" fill="#fed7aa">4. Mistral</text>
        <text x="532" y="74" text-anchor="middle" class="txt-dim">Fallback Model</text>

        <!-- Subtext details -->
        <text x="20" y="105" class="txt-dim">• Exponential Backoff: 1s ➔ 2s ➔ 4s retries on transient errors / rate limits</text>
        <text x="20" y="125" class="txt-dim">• Output Guardrails: Competitor name redaction &amp; response groundedness validator</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 3: BTP DESTINATIONS & BACKENDS (x: 980, w: 270) ==================== -->
  <g transform="translate(980, 95)" filter="url(#soft-shadow)">
    <rect width="270" height="715" fill="url(#dest-grad)" stroke="#ea580c" stroke-width="1.5" rx="14" />
    <rect x="15" y="18" width="240" height="34" rx="8" fill="#431407" stroke="#f97316" />
    <text x="135" y="40" text-anchor="middle" class="txt-hdr" fill="#fed7aa">☁️ BTP Destinations &amp; AI Models</text>

    <!-- Priority 1 Model Card -->
    <g transform="translate(15, 68)">
      <rect width="240" height="85" rx="8" fill="url(#p1-grad)" stroke="#34d399" stroke-width="1.5" />
      <text x="15" y="24" class="txt-hdr" fill="#a7f3d0">🥇 Priority 1 (Primary)</text>
      <text x="15" y="44" class="txt-body">google-diffusiongemma</text>
      <text x="15" y="62" class="txt-code" fill="#6ee7b7">google/diffusiongemma-26b-a4b-it</text>
      <text x="15" y="78" class="txt-dim">NVIDIA Foundation Endpoint</text>
    </g>

    <!-- Priority 2 Model Card -->
    <g transform="translate(15, 163)">
      <rect width="240" height="85" rx="8" fill="url(#p2-grad)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="15" y="24" class="txt-hdr" fill="#bae6fd">🥈 Priority 2 (P2)</text>
      <text x="15" y="44" class="txt-body">google-gemma-4-31b-it</text>
      <text x="15" y="62" class="txt-code" fill="#7dd3fc">google/gemma-4-31b-it</text>
      <text x="15" y="78" class="txt-dim">NVIDIA Foundation Endpoint</text>
    </g>

    <!-- Priority 3 Model Card -->
    <g transform="translate(15, 258)">
      <rect width="240" height="85" rx="8" fill="url(#p3-grad)" stroke="#c084fc" stroke-width="1.5" />
      <text x="15" y="24" class="txt-hdr" fill="#e9d5ff">🥉 Priority 3</text>
      <text x="15" y="44" class="txt-body">z-ai-glm-5-2</text>
      <text x="15" y="62" class="txt-code" fill="#d8b4fe">z-ai/glm-5.2</text>
      <text x="15" y="78" class="txt-dim">NVIDIA Foundation Endpoint</text>
    </g>

    <!-- Priority 4 Fallback Model Card -->
    <g transform="translate(15, 353)">
      <rect width="240" height="85" rx="8" fill="url(#p4-grad)" stroke="#fb923c" stroke-width="1.5" />
      <text x="15" y="24" class="txt-hdr" fill="#fed7aa">🛡️ Priority 4 (Fallback)</text>
      <text x="15" y="44" class="txt-body">mistralai-mistral-nemotron</text>
      <text x="15" y="62" class="txt-code" fill="#fdba74">mistralai/mistral-nemotron</text>
      <text x="15" y="78" class="txt-dim">Designated Fallback Target</text>
    </g>

    <!-- Managed Backends Card -->
    <g transform="translate(15, 450)">
      <rect width="240" height="247" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <text x="120" y="26" text-anchor="middle" class="txt-hdr" fill="#c7d2fe">SAP BTP Managed Backends</text>

      <g transform="translate(12, 40)">
        <text x="0" y="16" class="txt-hdr" fill="#a5b4fc">🔑 SAP XSUAA</text>
        <text x="0" y="32" class="txt-dim">JWT Authentication &amp; Scopes</text>

        <text x="0" y="62" class="txt-hdr" fill="#a5b4fc">⚡ SAP BTP Redis Instance</text>
        <text x="0" y="78" class="txt-dim">&lt; 5ms Completions Prompt Cache</text>

        <text x="0" y="108" class="txt-hdr" fill="#a5b4fc">🗄️ SAP HANA Cloud</text>
        <text x="0" y="124" class="txt-dim">HDI Container &amp; REAL_VECTOR Table</text>

        <text x="0" y="154" class="txt-hdr" fill="#a5b4fc">📊 LangSmith Observability</text>
        <text x="0" y="170" class="txt-dim">Tracing, Tokens &amp; Latency Profiling</text>

        <text x="0" y="196" class="txt-code" fill="#818cf8">VCAP_SERVICES Dynamic Bindings</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 250,220 L 275,220" stroke="#2dd4bf" stroke-width="2.5" class="flow-line" marker-end="url(#arr-teal)" />
  <path d="M 955,420 L 980,420" stroke="#fbbf24" stroke-width="2.5" class="flow-line" marker-end="url(#arr-amber)" />

</svg>
